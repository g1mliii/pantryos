version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      # typescript-eslint 8.x supports TypeScript < 6.1. Remove this once the
      # lint toolchain advertises support for the next TypeScript major.
      - dependency-name: typescript
        versions: [">=6.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
